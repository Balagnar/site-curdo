<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Umbandista Rei de Oxossi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#f7f8f4]">
    <!-- Header -->
    <header class="flex flex-col md:flex-row items-center justify-between px-4 md:px-8 py-4 bg-white border-b border-gray-200">
        <h2 class="font-bold text-[#1b4332]">Casa de Umbanda</h2>
        <nav class="flex items-center gap-2 text-sm font-medium text-gray-600 overflow-x-auto max-w-full pb-2 md:pb-0 whitespace-nowrap">
            <a href="index.html" class="px-4 py-2 hover:text-[#1b4332] sharink-0">Início</a>
            <a href="index.html#horarios" class="px-4 py-2 hover:text-[#1b4332]">Horários</a>
            <a href="#" class="px-4 py-2 hover:text-[#1b4332] sharink-0">Eventos</a>
            <a href="records.html" class="bg-[#dce9be] text-[#1b4332] px-4 py-2 rounded-full font-semibold">Galeria</a>
            <a href="#" class="px-4 py-2 hover:text-[#1b4332] sharink-0">Dúvidas</a>
            <a href="#" class="px-4 py-2 hover:text-[#1b4332] sharink-0">Localização</a>
            <a href="sobre.html" class="px-4 py-2 hover:text-[#1b4332] sharink-0">Sobre</a>
        </nav>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-20 text-center">
        <section>
            <span class="inline-block bg-[#dce9be] text-[#1b4332] px-4 py-2.5 rounded-full text-xl font-bold uppercase tracking-wider mb-6">
                Album de Recordações.
            </span>

            <h1 class="text-4xl md:text-3xl font-semibold text-[#1b4332] mb-6 leading-tight">
                Para Sempre Lembrar Daqueles Que Vieram Antes de Nós.
            </h1>
        </section>
    </main>

    <section class="max-w-6xl mx-auto px-6 pb-20">

        <div class="text-center space-y-4">
                <h2 class="text-3xl font-bold text-gray-800">Pai Carlito & Caboclo Jepetequara.</h2>
                
                <p class="text-gray-600 leading-relaxed">
                    Jepetequara é um Caboclo Africano.
                    Foi a Jurema Quem Cruzou!
                </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center max-w-5xl mx-auto px-4 mt-6">
             
            <!-- Bloco Imagem -->
            <div>
                <img src="img/vovo_com_macaco.png" alt="Foto historica do fundador da casa" class="rounded-2xl shadow-lg w-[500px] h-[500px] object-cover border-[4px] border-green-200">
            </div>
            <div>
                <img src="img/Jepetequara_1.png" alt="Foto historica do fundador da casa" class="rounded-2xl shadow-lg w-[500px] h-[500px] object-cover border-[4px] border-green-200">
            </div>
            <div>
                <img src="img/Jepetequara_2.png" alt="Foto historica do fundador da casa" class="rounded-2xl shadow-lg w-[500px] h-[500px] object-cover border-[4px] border-green-200">
            </div>
            <div>
                <img src="img/Jepetequara_3.png" alt="Foto historica do fundador da casa" class="rounded-2xl shadow-lg w-[500px] h-[500px] object-cover border-[4px] border-green-200">
            </div>
            <div>
                <img src="img/Jepetequara_4.png" alt="Foto historica do fundador da casa" class="rounded-2xl shadow-lg w-[500px] h-[500px] object-cover border-[4px] border-green-200">
            </div>
            <div>
                <img src="img/Jepetequara_5.png" alt="Foto historica do fundador da casa" class="rounded-2xl shadow-lg w-[500px] h-[500px] object-cover border-[4px] border-green-200">
            </div>
        </div>

    </section>

    <footer> </footer>
</body>
</html>
